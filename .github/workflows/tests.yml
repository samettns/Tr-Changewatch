name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Bağımlılıklar
        run: python -m pip install -e ".[dev]"
      # Testler ağa çıkmaz: STAC istemcisi sahte, veriler sentetik veya tests/fixtures altında.
      - name: pytest
        env:
          MPLBACKEND: Agg
        run: python -m pytest -q
