[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "changewatch"
version = "0.1.0"
description = "Ankara için Sentinel-2 tabanlı yapılaşma ve arazi örtüsü değişim izleme"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pystac-client",
    "planetary-computer",
    "odc-stac",
    "xarray",
    "rasterio",
    "numpy",
    "scipy",
    "scikit-image",
    "geopandas",
    "shapely",
    "matplotlib",
    "pyyaml",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
changewatch = "changewatch.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
