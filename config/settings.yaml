# TR-ChangeWatch ayarları. Eşikler ve parametreler yalnızca burada tutulur.
# Not: Windows yolları TEK tırnakla yazılmalı ("..." içinde \t sekmeye dönüşür).

paths:
  # Ham veri önbelleği ve ara çıktılar (harici SSD). Klasör yoksa program hata verir.
  cache_dir: 'D:\tr-changewatch-data'
  aois: config/aois.geojson
  validation_points: validation/points.geojson
  validation_labels: validation/labels.csv
  experiment_predictions: validation/experiment_predictions.csv
  water_validation_points: validation/water_points.geojson
  water_validation_labels: validation/water_labels.csv
  test_aoi_points: validation/test_aoi_points.geojson
  test_aoi_labels: validation/test_aoi_labels.csv
  error_panel: docs/img/hata_paneli.png      # validate: etiketle tahminin ayrıştığı en önemli noktalar
  experiment_figure: docs/img/deneyler.png    # experiments: test noktalarında varyant karşılaştırması

aoi_checks:
  max_aoi_km2: 100.0
  # Ankara ilinin kaba sınır kutusu (WGS84). Yalnızca uyarı için kullanılır.
  ankara_bbox:
    min_lon: 30.8
    min_lat: 38.6
    max_lon: 34.2
    max_lat: 40.8

grid:
  crs: EPSG:32636          # UTM 36N
  resolution_m: 20

years:
  start: 2017
  end: 2026

stac:
  url: https://planetarycomputer.microsoft.com/api/stac/v1
  collection: sentinel-2-l2a
  max_cloud_cover: 60      # sahne düzeyinde gevşek ön filtre (%); asıl temizlik SCL maskesiyle
  bands: [B02, B03, B04, B08, B11, B12, SCL]
  scl_band: SCL
  resampling: {"*": average, SCL: nearest}   # 10 m bantlar 20 m'ye ortalanır; SCL sınıf olduğu için en yakın komşu
  nodata: 0
  # Doku için 10 m katman: B08 doğal çözünürlükte, SCL (20 m) en yakın komşuyla 10 m'ye
  bands_10m: [B08, SCL]
  resampling_10m: {"*": nearest}
  reflectance_scale: 10000   # DN → yansıtım

scenes:
  report_cloud_threshold: 30   # `changewatch scenes` tablosundaki "bulut < %X" sütunu

harmonize:
  min_baseline: "04.00"
  offset_dn: 1000
  # s2:processing_baseline alanı yoksa bu tarih ve sonrası düzeltilir (log'a uyarı yazılır).
  fallback_date: "2022-01-25"

mask:
  scl_masked_classes: [0, 1, 3, 8, 9, 10, 11]
  # SCL maskesinden sonra AOI içinde geçerli piksel oranı bunun altındaki sahne kompozite alınmaz (log'a yazılır)
  min_valid_fraction: 0.20

composite:
  min_valid_obs: 3
  season: summer           # E2 deneyi ile karar verilecek
  windows:
    summer: {start: "07-01", end: "09-15"}
    spring: {start: "05-01", end: "06-30"}

texture:
  band: B08
  resolution_m: 10           # çalışma ızgarasının (20 m) tam böleni olmalı
  window_px: 5               # 10 m'de 5x5 = 50 m pencerede yerel std
  # Doku her sahnede ayrı hesaplanır, sonra sahnelerin medyanı alınır.
  # Pencerede geçerli piksel oranı bunun altındaysa o sahnede doku NaN.
  # 1.0 denendi: 2017'de her sahnede maskelenen parlak şantiyelerde doku %1,74 boş kalıyordu.
  min_window_valid: 0.5

change:
  # CVA: iki yılın yansıtım vektörleri arasındaki Öklid uzaklığı (yansıtım birimi)
  cva_bands: [B02, B03, B04, B08, B11, B12]
  # Doku farkı: |TEXTURE_b - TEXTURE_a|
  # Her iki büyüklük için eşik AOI içindeki dağılımdan Otsu ile otomatik seçilir
  otsu_bins: 256
  combine: or                # aday = CVA > eşik VEYA doku farkı > eşik ("and" da seçilebilir)
  # Parça kanıtı "sinyal": bir sinyalin parçadaki işaretli piksel payı bunun altındaysa yok sayılır
  # ("cva", "doku" ya da "ikisi")
  signal_min_share: 0.5

# Değişim yöntemi: breakpoint (varsayılan) | pairs (ardışık yıl çiftleri; E1 karşılaştırması için)
change_method: breakpoint

# Kırılma noktası yöntemi (spec §4). k değerleri kalibrasyonsuz başlangıç değerleridir (Faz 3).
# Değişkenler (bantlar + doku) kendi gürültü düzeylerine (σ) bölünerek z-ölçeklenir.
# σ: tüm piksellerin seçilen kırılmaya göre parça içi mutlak sapmalarının medyanı (iki sabit geçiş).
breakpoint:
  bands: [B02, B03, B04, B08, B11, B12]
  include_texture: true
  min_before: 1
  min_after: 2                 # kalıcı katman: kırılma sonrası ≥ 2 yıl (son yıl kırılmaları dahil değil)
  monitor_min_after: 1         # izleme katmanı: son yıldaki kırılmalar ayrı geçişte (güven düşük)
  score_k: 3.0                 # skor = basamak_z / max(yayılım_z, gürültü_z) > score_k
  step_k: 3.0                  # basamak_z > step_k × gürültü_z (gürültü_z: piksellerin yayılım_z medyanı)
  texture_k: 3.0               # doku basamağı anlamlı pozitif: > texture_k × σ_doku
  ndvi_k: 3.0                  # NDVI basamağı anlamlı negatif: < −ndvi_k × σ_NDVI
  # sinyal: basamağın spektral (bantlar) ve doku bileşenleri kendi gürültüleriyle ayrı test edilir:
  # bileşen_z > step_k × bileşen gürültüsü → anlamlı. İkisi de anlamlı → "ikisi"; biri → o;
  # hiçbiri tek başına anlamlı değilse gürültüye göre büyük olan. Parça: piksel çoğunluğu.
  year_mode_filter_px: 3       # kırılma yılı mod filtresi penceresi
  after_years_high: 3          # kırılma sonrası ≥ 3 yıl → güven yüksek
  after_years_medium: 2        # 2 yıl → orta; 1 yıl → izlemede (düşük)

# Su kuralı (geliştirme AOI'si: golbasi; tüm AOI'lerde çalışır). Kırılma yöntemi MNDWI serisine uygulanır.
water:
  threshold: 0.0               # su = MNDWI > eşik (sabit; Otsu yalnızca tanı amaçlı CSV'de)
  min_body_ha: 5.0             # yalnızca ≥ bu alandaki bağlı su kütleleri su sayılır (çatı/sera elenir)
  shore_px: 3                  # kazanım/kayıp yalnızca kıyı şeridinde: b−1 veya b yılında su kütlesi sınırına ≤ N piksel
  mmu_ha: 0.2                  # su türleri için ayrı MMU; açma işlemi uygulanmaz
  min_after: 2                 # kalıcı su katmanı
  monitor_min_after: 1         # son yıl su izleme katmanı
  majority: 0.5                # parça (öncesi/sonrası) su durumu: yılların > yarısında su
  otsu_bins: 256               # yalnızca tanı (water_series.csv)
  wetland_ndvi_min: 0.3        # sulak_alan_belirsiz: NDVI > bu …
  wetland_mndwi_margin: 0.15   # … ve |MNDWI − eşik| < bu (kırılmanın iki yanından birinde)
  wetland_min_share: 0.5       # parçada bu paydan fazla kıyı/sazlık pikseli → sulak_alan_belirsiz

# Faz 3 doğrulama örneklemesi (`changewatch sample`). Tabaka: kalıcı katmandaki her tür + degisim_yok.
validation:
  aois: [incek, golbasi]       # geliştirme AOI'leri; test AOI'leri (baglica, pursaklar) dondurulmuş yöntemle sonra
  method: breakpoint
  seed: 43                     # su kuralı değişince yeniden örnekleme (önceki: 42)
  total_points: 280
  no_change_points: 100        # degisim_yok tabakası (sabit)
  min_per_stratum: 20          # değişim tabakaları: kalan noktalar alanla orantılı, tabaka başına en az bu kadar…
  min_stratum_area_ha: 20      # …yalnızca alanı ≥ bu olan tabakalarda (küçük tabakalar yalnızca orantılı pay)
  max_points_per_polygon: 3
  min_point_distance_m: 60     # aynı AOI'de noktalar arası en az
  calibration_share: 0.3       # tabaka içinde rastgele %30 kalibrasyon, %70 test
  chip_px: 41                  # çip kenarı (piksel; 41 × 20 m = 820 m)
  chip_upscale: 5
  label_roles: [test]          # etiketleme arayüzüne gelen roller (kalibrasyon gizli; yöntem donduruldu)
  label_big_px: 330            # etiket çipi (solda): ilk ve son yıl karesi kenarı (yaklaşık; tam sayı büyütme → 328)
  label_strip_upscale: 3       # etiket çipi (sağda): tüm yıllar şeridi 2 × 5, kare kenarı 41 × 3 = 123 px
  label_ring_m: 100            # nokta çevresindeki halka yarıçapı
  label_scalebar_m: 200        # ölçek çubuğu uzunluğu
  label_seed: 7                # etiketleme arayüzünde karışık sıra
  chip_salt: tr-changewatch-kor  # çip dosya adı belirteci (tahmin/tabaka/kimlik içermez)
  water_aois: [golbasi]        # su doğrulama seti (tüm su poligonları)
  error_panel_n: 10            # validate: hata panelindeki nokta sayısı (0 = panel yok)

# Test AOI'leri (yöntem dondurulduktan sonra; hiçbir ayar değiştirilmeden). Tabakalama `validation` ile aynı
# (poligon başına üst sınır, nokta aralığı, tabaka alan alt sınırı oradan); sayılar 280 noktalık tasarımın oranları.
test_validation:
  aois: [baglica, pursaklar]
  points_per_aoi: 60           # her AOI ayrı örneklenir
  no_change_points: 21         # 60 × 100/280
  min_per_stratum: 4           # 60 × 20/280 (yalnızca alanı ≥ validation.min_stratum_area_ha tabakalarda)
  seed: 44                     # yeni seed (geliştirme örneklemesi: 43)
  calibration_share: 0.0       # hepsi test

# Kalıcılık + tür/güven (ilk sürüm; eşikler Faz 3'te kalibrasyon noktalarıyla ayarlanacak)
classify:
  # Kalıcılık: (y-1 → y) değişimi y+1'de de sürüyor mu? Piksel bazında, aynı çiftin Otsu eşikleriyle:
  #  CVA ile işaretli piksel: CVA(y-1 → y+1) > eşik ; doku ile işaretli: aynı yönde |Δdoku(y-1 → y+1)| > eşik
  persistence_min_share: 0.5     # parçadaki kalıcı piksel payı ≥ bu → kalici_mi = true
  drop_non_persistent: true      # kalıcı olmayan parçalar (ör. nadas) çıktıya yazılmaz, istatistikte sayılır
  # Doku artışı: işaretli Δdoku > çiftin doku Otsu eşiği olan piksel payı
  texture_increase_min_share: 0.5
  water_mndwi_threshold: 0.0     # su: sonraki yılda (y) ve kalıcılık yılında (y+1) medyan MNDWI > eşik
  ndvi_drop: 0.10                # bitki kaybı: medyan dNDVI < -eşik ve y+1'de de < -eşik

morphology:
  open_radius_px: 1          # açma: tekil/ince gürültüyü atar (disk yarıçapı, piksel)
  close_radius_px: 1         # kapama: küçük boşlukları doldurur
  connectivity: 2            # 8-komşuluk
  mmu_ha: 0.5                # 0,5 ha = 13 piksel (20 m)

quicklook:
  # Doğal renk: sabit yansıtım aralığı (yıllar arası karşılaştırılabilir olsun diye yüzdelik germe yok)
  rgb_bands: [B04, B03, B02]
  rgb_min: 0.0
  rgb_max: 0.30
  gamma: 1.0
  dpi: 100
  # Aday maskesi bindirmesi
  overlay_color: [1.0, 0.0, 0.0]
  overlay_alpha: 0.45
  overlay_upscale: 2         # PNG'yi gözle kontrol için en yakın komşuyla büyüt
  boundary_color: [1.0, 1.0, 0.0]   # yapılaşma sınır paneli çizgi rengi
  series_color: "#2a78d6"     # tek serili grafikler ve su maskesi (tek ton)
  # İndeks PNG'leri: yıllar arası karşılaştırma için sabit renk aralıkları
  indices:
    NDVI:  {vmin: -0.2, vmax: 0.8,  cmap: RdYlGn}
    NDBI:  {vmin: -0.4, vmax: 0.4,  cmap: RdBu_r}
    MNDWI: {vmin: -0.8, vmax: 0.4,  cmap: BrBG}
    BSI:   {vmin: -0.3, vmax: 0.4,  cmap: PuOr_r}
    TEXTURE: {vmin: 0.0, vmax: 0.08, cmap: magma}

# Faz 5: aylık izleme (`changewatch monitor`, monthly.yml). Son `months` tam ay ↔ önceki yılın aynı ayları.
# Sonuçlar "ön uyarı"dır: kalibre edilmedi, doğrulanmadı; yıllık kalıcı katmandan ayrı gösterilir.
monitor:
  months: 3
  aois: [incek, golbasi, baglica, pursaklar]
  bands: [B02, B03, B04, B08, B11, B12]
  min_valid_obs: 2            # dönem kompozitinde piksel başına en az geçerli gözlem (3 ay; yaz penceresinden kısa)
  min_coverage: 0.6           # AOI'nin iki dönemde de geçerli piksel oranı bunun altındaysa analiz atlanır (kış/kar)
  z_k: 3.0                    # CVA büyüklüğünün AOI içi sağlam z-skoru > z_k (kırılma yöntemindeki k ile aynı)
  texture_z_k: 3.0            # VE 10 m doku artışının sağlam z-skoru > bu (yapılaşma kanıtı; tarlalar doku kazanmaz)
  max_ndvi_gain: 0.1          # ΔNDVI > bu olan pikseller (yeşillenme) ön uyarı sayılmaz
  retry_tries: 6              # Planetary Computer 429/5xx: üstel bekleme ile deneme sayısı
  retry_base_s: 10            # ilk bekleme (s); 10, 20, 40, 80, 160
  max_file_kb: 1024           # monthly.yml yalnızca bundan küçük GeoJSON/JSON dosyalarını commit'ler

# Faz 4: web haritası çıktıları (`changewatch publish`). Yöntem/eşik değil; yalnızca neyin nasıl yayınlandığı.
publish:
  out_dir: docs/data
  aois: [incek, golbasi, baglica, pursaklar]
  method: breakpoint
  aoi_labels: {incek: "İncek–Kızılcaşar", golbasi: "Gölbaşı (Mogan)", baglica: "Bağlıca–Etimesgut", pursaklar: "Pursaklar"}
  test_aois: [baglica, pursaklar]   # sayfada "görülmemiş bölge" olarak işaretlenir
  # v1 yayın kararları (README): su poligonları yayınlanmaz; bitki kaybı ve belirsiz "deneysel", varsayılan kapalı
  types: [yapilasma_olasi, bitki_kaybi, belirsiz]
  experimental_types: [bitki_kaybi, belirsiz]
  default_on_types: [yapilasma_olasi]
  water_series_aois: [golbasi, pursaklar]   # su alanı serisi grafiği (poligon değil)
  simplify_m: 10.0           # Douglas–Peucker toleransı (UTM, metre; yarım piksel)
  coord_decimals: 6          # WGS84 koordinat hassasiyeti (~0,1 m)
  # Popup'ta gösterilen kanıt alanları (geri kalanı yazılmaz)
  evidence_props: [sinyal, skor, sonrasi_yil_sayisi, dNDVI, dNDBI, dBSI, dMNDWI, doku_artisi, doku_artisi_payi,
                   gecerli_gozlem_sayisi, dusuk_gozlem]
  quicklook_crs: EPSG:3857   # Leaflet görüntü bindirmesi için (Web Mercator'a yeniden örnekleme, en yakın komşu)
  quicklook_colors: 256      # PNG palet rengi (boyut için nicemleme)
  max_png_kb: 500
  max_total_mb: 50
